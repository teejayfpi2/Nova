<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0f19" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Nova</title>
<link rel="manifest" href="/static/manifest.json" />
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<header>
  <div class="brand">
    <span class="orb"></span>
    <h1>Nova</h1>
  </div>
  <div class="status" id="status">connecting…</div>
  <button id="settings-btn" title="Settings">⚙</button>
</header>

<main>
  <section id="chat" class="chat"></section>
  <div id="hint" class="hint">Try: “what's on my calendar”, “text Alex I'm running late”, “remind me to call mum at 6pm”</div>
</main>

<footer>
  <button id="mic" class="mic" title="Hold to talk">🎤</button>
  <input id="input" type="text" placeholder="Ask Nova anything…" autocomplete="off" />
  <button id="send" class="send" title="Send">➤</button>
  <label class="toggle"><input type="checkbox" id="speak-toggle" checked /> voice</label>
</footer>

<dialog id="settings">
  <form method="dialog">
    <h2>Settings</h2>
    <label>Server URL <input id="s-url" placeholder="same origin" /></label>
    <label>Access token <input id="s-token" type="password" placeholder="optional" /></label>
    <label>Voice replies <input type="checkbox" id="s-voice" checked /></label>
    <p class="muted" id="voice-info"></p>
    <menu>
      <button value="cancel">Close</button>
      <button id="save" value="save">Save</button>
    </menu>
  </form>
</dialog>

<script src="/static/app.js"></script>
</body>
</html>
