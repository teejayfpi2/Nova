name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make the Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build the APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Show what was built
        run: |
          ls -la android/app/build/outputs/apk/debug/
          find android/app/build/outputs -name "*.apk" -exec sha256sum {} \;

      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Rename the APK for release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp android/app/build/outputs/apk/debug/app-debug.apk nova-android-debug.apk

      - name: Publish the rolling "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Nova latest (debug build)
          body: |
            Automatic debug build of the Nova Android app.

            Built from ${{ github.sha }} by GitHub Actions.
          files: nova-android-debug.apk
          prerelease: true
